<!DOCTYPE html>
<html class="scroll-smooth dark" lang="en">
<head>
  <meta charset="utf-8"/>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#E6396E",
            "primary-hover": "#D0275B",
            navy: {
              800: "#1A264F",
              900: "#101935",
              950: "#090E1F",
            },
            rosecream: "#FFF5F7",
            "background-light": "#FCFBFB",
            "background-dark": "#0B1120",
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          },
          borderRadius: {
            DEFAULT: "1rem",
            '2xl': '1.5rem',
            '3xl': '2rem',
          },
          boxShadow: {
            'rose-glow': '0 20px 50px -10px rgba(230, 57, 110, 0.28)',
            'card-soft': '0 10px 30px -5px rgba(0, 0, 0, 0.04)',
          }
        },
      },
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #080507; }
    ::-webkit-scrollbar-thumb { background: rgba(230, 57, 110, 0.4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #e6396e; }

</head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 font-sans antialiased transition-colors duration-300 selection:bg-pink-500 selection:text-white">
